name: 'build docker images optimized'

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare
        id: prepare
        run: |
          DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/${GITHUB_REPOSITORY#*/}
          SHORTREF=${GITHUB_SHA::8}
          BRANCH=${GITHUB_REF#refs/heads/}
          BUILD_VERSION=${BRANCH}-${SHORTREF}

          # Use latest as default image tag
          TAGS="${DOCKER_IMAGE}:latest,${DOCKER_IMAGE}:${SHORTREF}"

          # If this is git tag, check tag name for semver
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # Extract semver tag v1.0.1 to VERSION 1.0.1
            VERSION=${GITHUB_REF#refs/tags/v}
            BUILD_VERSION=$VERSION

            # If the VERSION looks like a semver version major.minor.patch,
            # tag image also with major, major.minor
            if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
              MAJOR=$(echo ${VERSION} | cut -d. -f1)
              MAJOR_MINOR=$(echo ${VERSION} | cut -d. -f1,2)
              TAGS="${DOCKER_IMAGE}:latest,${DOCKER_IMAGE}:${MAJOR},${DOCKER_IMAGE}:${MAJOR_MINOR},${DOCKER_IMAGE}:${VERSION}"
            fi
          fi

          echo "{\"version\":\"${BUILD_VERSION}\",\"commit\":\"${GITHUB_SHA}\",\"created\":\"$(date -Is)\",\"createdBy\":\"github action #${{ github.run_id }}\"}" | tee .build.json
          echo "${DOCKER_IMAGE}"
  
          # Set output parameters.
          echo tags=${TAGS} >> $GITHUB_OUTPUT
          echo docker_image=${DOCKER_IMAGE} >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all
          # Optimize QEMU performance for ARM builds
          #image: tonistiigi/binfmt:latest

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Configure buildx for better arm64 performance
          buildkitd-config-inline: |
            [build]
            gc-policy = "max-unused-build-cache-size=9gb"

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build amd64
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: amd64-temp-cache
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Build arm64
        #if: false
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Push image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          # This will pull the amd64 and arm64 layers directly from the GHA cache
          # and push them as a single multi-arch manifest to Docker Hub.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.prepare.outputs.tags }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64